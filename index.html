<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tasks</title>
<style>
:root{--canvas:#faf7f5;--page:#fff;--line:#ece5e6;--line2:#d6cccd;--ink:#2a2224;--mut:#6b5f62;--maroon:#3f0d12;--crimson:#a71d31;--crimson-h:#8f1829;--blush:#f6e8ea;--warn:#b45309;--bad:#c4320a;--ok:#2b8a5a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.mark{width:32px;height:32px;border-radius:50%;background:var(--crimson);color:#fff;display:grid;place-items:center;font:700 16px Merriweather,Georgia,serif}
h1{font:700 26px Merriweather,Georgia,serif;color:var(--maroon);letter-spacing:-.01em;margin:0}
.who{display:flex;align-items:center;gap:10px;flex:1 1 100%}
@media(min-width:800px){.who{flex:0 1 480px}}
.who>span,.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.seg,.tabs{display:flex;flex-wrap:nowrap;gap:6px;flex:1}
.seg{gap:3px}
.seg button{padding:0 9px}
.layout{display:grid;gap:36px;grid-template-columns:1fr;margin-top:22px}
@media(min-width:800px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);align-items:start;column-gap:48px}aside{position:sticky;top:16px}}
select,input{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:8px;padding:9px 12px;min-height:40px;width:100%;outline:none}
select:focus,input:focus{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(167,29,49,.15)}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;min-height:24px;padding:3px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;transition:background .15s,border-color .15s}
button:hover{background:var(--canvas)}
button.p{color:#fff;background:var(--crimson);border-color:var(--crimson)}
button.p:hover{background:var(--crimson-h)}
.seg button,.tabs button{flex:1;min-width:0;height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on,.tabs button.on{background:var(--blush);border-color:#d98f9b;color:var(--maroon)}
.row{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.row.c input{flex:1;max-width:190px;text-align:center}
.row.c button{height:34px}
.tabs{margin-bottom:6px}
.card{background:#fff;border:0;border-top:1px solid var(--line);padding:14px 0}
.t{display:flex;gap:12px;align-items:center}
.t .b{flex:1;min-width:0}
.t .ti{font-weight:600;font-size:16px;word-break:break-word}
.t small{color:var(--mut)}
.t.done .ti{color:var(--mut);text-decoration:line-through}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.dn{flex:none;padding:3px 16px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 10px}
.tag.w{color:var(--warn);background:rgba(220,104,3,.1)}
.tag.g{color:var(--ok);background:rgba(43,138,90,.1)}
.tag.x{color:var(--bad);background:rgba(196,50,10,.08)}
.del{min-height:24px;padding:2px 8px;border-color:transparent;background:none;color:var(--mut)}
.del:hover{color:var(--bad);background:rgba(196,50,10,.06)}
aside .card{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0}
details summary{cursor:pointer;font-size:17px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
form .f{grid-column:1/-1}
@media(max-width:480px){form{grid-template-columns:1fr}}
label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;gap:4px}
label input,label select{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;color:var(--ink)}
form button.p{height:38px;font-size:14px}
#msg{color:var(--bad);font-size:14px;font-weight:600;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:36px 12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><div class="mark">F</div><h1>Family Tasks</h1></div>
  <select id="me" hidden></select>
  <div class="who"><div class="seg" id="meBtns"></div></div>
</header>
<div id="msg"></div>

<div class="layout"><section>
<div class="row c">
  <button id="prev">‹</button>
  <input type="date" id="day">
  <button id="next">›</button>
  <button id="today">Today</button>
</div>

<div class="row tabs" id="tabs">
  <button data-v="mine" class="on">For me</button>
  <button data-v="by">I assigned</button>
  <button data-v="all">Everyone</button>
</div>

<div id="list"></div>

</section><aside>
<details class="card" id="addbox">
  <summary><b>➕ Add a task</b></summary>
  <form id="f" style="margin-top:10px">
    <label class="f">Task<input id="ti" required maxlength="120" placeholder="e.g. Take out the trash"></label>
    <label>Assign to<select id="as"></select></label>
    <label>Date<input type="date" id="dt" required></label>
    <label>Repeat<select id="rp">
      <option value="none">Does not repeat</option><option value="daily">Every day</option>
      <option value="weekdays">Weekdays (Mon–Fri)</option><option value="weekly">Every week</option>
      <option value="monthly">Every month</option></select></label>
    <label>Repeat until (optional)<input type="date" id="un"></label>
    <label class="f">Auto-close at (optional; blank = end of day)<input type="time" id="ct"></label>
    <button class="p f">Add task</button>
  </form>
</details>
</aside></div>
</main>

<script>
// 1) Paste your Apps Script Web App URL here:
const API = 'https://script.google.com/macros/s/AKfycbw3-ttHOKNieYo9pv9UpadABC93__mwXOi4EwHknmxzXQgviVtrWpJAeGOQFXmaejhp/exec';
const PEOPLE = ['Sourabh','Vranda','Girisha','Disha'];

const $ = id => document.getElementById(id);
let tasks = [], done = [], view = 'mine';
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

PEOPLE.forEach(p => { $('me').add(new Option(p,p)); $('as').add(new Option(p,p)); });
$('me').value = store.get('me') || PEOPLE[0];
function paintMe(){ $('meBtns').innerHTML = PEOPLE.map(p => `<button type="button" class="${p===$('me').value?'on':''}" data-p="${p}">${p}</button>`).join(''); }
$('meBtns').onclick = e => { const p = e.target.dataset.p; if (!p) return; $('me').value = p; $('me').onchange(); };
paintMe();
$('day').value = $('dt').value = ymd(new Date());

function occurs(t, d){
  if (d < t.start || (t.until && d > t.until)) return false;
  const a = new Date(t.start+'T00:00'), b = new Date(d+'T00:00');
  const diff = Math.round((b-a)/864e5);
  switch(t.repeat){
    case 'daily': return true;
    case 'weekdays': return b.getDay()%6 !== 0;
    case 'weekly': return diff%7 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    default: return diff === 0;
  }
}
function autoClosed(t, d){
  const now = new Date(), today = ymd(now);
  if (d < today) return true;
  if (d > today) return false;
  const hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return hm >= (t.closeTime || '23:59');
}
const doneRec = (t,d) => done.find(r => r.taskId===t.id && r.date===d);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RP = {none:'',daily:'🔁 daily',weekdays:'🔁 weekdays',weekly:'🔁 weekly',monthly:'🔁 monthly'};

function render(){
  const me = $('me').value, d = $('day').value;
  let items = tasks.filter(t => occurs(t,d) && !doneRec(t,d));
  if (view==='mine') items = items.filter(t => t.assignee===me);
  if (view==='by') items = items.filter(t => t.creator===me);
  $('list').innerHTML = items.length ? items.map(t => {
    const r = doneRec(t,d), ac = !r && autoClosed(t,d), mine = t.assignee===me;
    const st = r ? `<span class="tag g">✓ done${r.by!==t.assignee?' by '+r.by:''}</span>`
      : ac ? `<span class="tag x">auto-closed ${t.closeTime||''}</span>`
      : `<span class="tag w">open${t.closeTime?' · closes '+t.closeTime:''}</span>`;
    const btn = mine && !ac
      ? `<button class="p dn" onclick="finish('${t.id}','${d}')">Done</button>`
      : '';
    return `<div class="card t ${r||ac?'done':''}">${btn}<div class="b">
      <div class="ti">${esc(t.title)}</div>
      <div class="meta"><small>${t.assignee} · from ${t.creator} ${RP[t.repeat]?'· '+RP[t.repeat]:''}</small>${st}</div></div>
      ${t.creator===me?`<button class="del" onclick="del('${t.id}')" title="Delete">🗑</button>`:''}</div>`;
  }).join('') : '<div class="empty">Nothing here for this day 🎉</div>';
}

async function load(){
  if (API.startsWith('PASTE')) { $('msg').textContent = 'Set the API URL in index.html (see setup steps).'; return; }
  try {
    const r = await (await fetch(API)).json();
    const fix = (v, time) => { if (!v || !/GMT|T\d\d:/.test(v)) return v; const d = new Date(v);
      return isNaN(d) ? v : time ? String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') : ymd(d); };
    tasks = r.tasks.map(t => ({...t, start:fix(t.start), until:fix(t.until), closeTime:fix(t.closeTime,true)}));
    done = r.done.map(x => ({...x, date:fix(x.date)})); $('msg').textContent = ''; render();
  } catch(e){ $('msg').textContent = 'Could not reach Google Sheet. Check the URL and deployment access.'; }
}
async function send(body){
  try { await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}); }
  catch(e){ $('msg').textContent = 'Save failed — reloading.'; }
  load();
}

function finish(id,d){
  const t = tasks.find(x => x.id===id), me = $('me').value;
  if (t.repeat === 'none') { tasks = tasks.filter(x => x!==t); send({action:'delete',taskId:id}); }
  else { done.push({taskId:id,date:d,by:me}); send({action:'complete',taskId:id,date:d,by:me}); }
  render();
}
function del(id){
  if (!confirm('Delete this task (and all its repeats)?')) return;
  tasks = tasks.filter(t => t.id!==id); render(); send({action:'delete',taskId:id});
}

$('f').onsubmit = e => {
  e.preventDefault();
  const t = { id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), title:$('ti').value.trim(),
    assignee:$('as').value, creator:$('me').value, start:$('dt').value, repeat:$('rp').value,
    until:$('un').value, closeTime:$('ct').value, created:new Date().toISOString() };
  if (!t.title) return;
  const n = new Date(), hm = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  if (t.start === ymd(n) && t.closeTime && t.closeTime <= hm) {
    alert('That auto-close time has already passed today, so the task would close immediately. Pick a later time or leave it blank.'); return;
  }
  tasks.push(t); $('day').value = t.start; render(); send({action:'add',task:t});
  $('ti').value=''; if (innerWidth < 800) $('addbox').open = false;
};
const shift = n => { const d = new Date($('day').value+'T00:00'); d.setDate(d.getDate()+n); $('day').value = ymd(d); render(); };
$('prev').onclick = () => shift(-1); $('next').onclick = () => shift(1);
$('today').onclick = () => { $('day').value = ymd(new Date()); render(); };
$('day').onchange = render;
$('me').onchange = () => { store.set('me',$('me').value); paintMe(); render(); };
$('tabs').onclick = e => { if(!e.target.dataset.v) return; view = e.target.dataset.v;
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b===e.target)); render(); };

if (innerWidth >= 800) $('addbox').open = true;
load(); setInterval(load, 60000); // refresh every minute (also updates auto-close)
</script>
</body>
</html>
